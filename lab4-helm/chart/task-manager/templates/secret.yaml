# DVO-L4-3C8B52
{{- $name := printf "%s-secret" (include "task-manager.fullname" .) }}
{{- $password := .Values.secret.postgresPassword | toString }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 20 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "task-manager.labels" (dict "ctx" . "component" "secret") | nindent 4 }}
  annotations:
    {{- include "task-manager.annotations" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-db:5432/%s" .Values.config.postgresUser ($password | urlquery) (include "task-manager.fullname" .) .Values.config.postgresDb | quote }}
