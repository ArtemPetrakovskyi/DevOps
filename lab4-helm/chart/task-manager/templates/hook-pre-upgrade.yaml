# DVO-L4-3C8B52
{{- if .Values.hooks.preUpgrade.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "task-manager.fullname" . }}-pre-upgrade
  labels:
    {{- include "task-manager.labels" (dict "ctx" . "component" "hook") | nindent 4 }}
  annotations:
    {{- include "task-manager.annotations" . | nindent 4 }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "task-manager.labels" (dict "ctx" . "component" "hook") | nindent 8 }}
      annotations:
        {{- include "task-manager.annotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: check-db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          command:
            - sh
            - -c
            - |
              echo "pre-upgrade: перевірка доступності БД перед оновленням";
              pg_isready -h {{ include "task-manager.fullname" . }}-db -p 5432 -U {{ .Values.config.postgresUser | quote }}
{{- end }}
