# DVO-L4-3C8B52
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "task-manager.fullname" . }}-web
  labels:
    {{- include "task-manager.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  annotations:
    {{- include "task-manager.annotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "task-manager.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
