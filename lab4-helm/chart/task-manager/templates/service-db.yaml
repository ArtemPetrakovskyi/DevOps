# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-manager.fullname" . }}-db
  labels:
    {{- include "task-manager.labels" (dict "ctx" . "component" "db") | nindent 4 }}
  annotations:
    {{- include "task-manager.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "task-manager.selectorLabels" (dict "ctx" . "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
