# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-manager.fullname" . }}-db
  labels:
    {{- include "task-manager.labels" (dict "ctx" . "component" "db") | nindent 4 }}
  annotations:
    {{- include "task-manager.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.db.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "task-manager.selectorLabels" (dict "ctx" . "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-manager.labels" (dict "ctx" . "component" "db") | nindent 8 }}
      annotations:
        {{- include "task-manager.annotations" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-manager.fullname" . }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-manager.fullname" . }}-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-manager.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: data
          {{- if .Values.db.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "task-manager.fullname" . }}-db-data
          {{- else }}
          emptyDir: {}
          {{- end }}
