# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-manager.fullname" . }}-api
  labels:
    {{- include "task-manager.labels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    {{- include "task-manager.annotations" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "task-manager.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
