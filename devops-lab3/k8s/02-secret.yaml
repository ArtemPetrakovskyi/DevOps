# Чутливі параметри. УВАГА: значення навчальні, не використовуйте реальні паролі.
# stringData дозволяє писати значення відкритим текстом - Kubernetes сам
# збереже їх у base64 у полі data.
apiVersion: v1
kind: Secret
metadata:
  name: tasks-secret
  namespace: task-manager
  labels:
    app.kubernetes.io/part-of: task-manager
type: Opaque
stringData:
  POSTGRES_PASSWORD: "lab-only-password"
  DATABASE_URL: "postgresql://tasks:lab-only-password@db:5432/tasks"
