# Внутрішній доступ до API: http://api:5000
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: task-manager
  labels:
    app: api
    app.kubernetes.io/part-of: task-manager
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 5000
      targetPort: http
