# Веб-інтерфейс. Rolling update без простою: maxUnavailable 0 + readiness-проба.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: task-manager
  labels:
    app: web
    app.kubernetes.io/part-of: task-manager
spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: task-manager
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: tasks-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: tasks-config
                  key: APP_TITLE
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: tasks-config
                  key: API_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tasks-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
