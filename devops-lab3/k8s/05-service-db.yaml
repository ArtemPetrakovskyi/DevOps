# Внутрішній доступ до бази: db:5432 (лише всередині кластера).
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: task-manager
  labels:
    app: db
    app.kubernetes.io/part-of: task-manager
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
