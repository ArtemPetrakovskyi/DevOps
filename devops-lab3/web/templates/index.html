<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
    h1 { font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
    .badge { font-size: .75rem; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 999px; }
    form.add { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type=text] { flex: 1; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button.ghost { background: #e2e8f0; color: #1f2937; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #94a3b8; }
    .error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; }
    footer { margin-top: 28px; font-size: .8rem; color: #64748b; }
  </style>
</head>
<body>
  <h1>{{ title }} <span class="badge">v{{ version }}</span></h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="add" method="post" action="{{ url_for('add') }}">
    <input type="text" name="title" placeholder="Нова задача" required>
    <button type="submit">Додати</button>
  </form>
  <ul>
    {% for t in tasks %}
    <li class="{{ 'done' if t.done else '' }}">
      <span>{{ t.title }}</span>
      <form method="post" action="{{ url_for('toggle', task_id=t.id) }}">
        <button class="ghost" type="submit">{{ 'Повернути' if t.done else 'Готово' }}</button>
      </form>
      <form method="post" action="{{ url_for('delete', task_id=t.id) }}">
        <button class="ghost" type="submit">Видалити</button>
      </form>
    </li>
    {% else %}
    <li><span>Задач поки немає</span></li>
    {% endfor %}
  </ul>
  <footer>версія {{ version }} · под: {{ pod }}</footer>
</body>
</html>
